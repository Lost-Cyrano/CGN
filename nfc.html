<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cartes NFC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { margin: 5px; padding: 10px; }
    #cards { margin-top: 20px; }
    .card {
      border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-actions button { margin-left: 5px; }
  </style>
</head>
<body>

<h2>Gestion des Cartes NFC</h2>

<button onclick="addCard()">➕ Ajouter une carte NFC</button>

<div id="cards"></div>

<script>
  const cardsKey = 'nfc_cards';
  let cards = JSON.parse(localStorage.getItem(cardsKey)) || [];

  function saveCards() {
    localStorage.setItem(cardsKey, JSON.stringify(cards));
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('cards');
    container.innerHTML = '';
    cards.forEach((card, index) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div><strong>ID:</strong> ${card.name}<br><small>${card.tag}</small></div>
        <div class="card-actions">
          <button onclick="writeCard(${index})">📤 Écrire</button>
          <button onclick="deleteCard(${index})">🗑️ Supprimer</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  async function addCard() {
    if (!("NDEFReader" in window)) {
      alert("NFC non pris en charge sur ce navigateur.");
      return;
    }

    const name = prompt("Donnez un identifiant pour cette carte (ex: 308):");
    if (!name) return;

    try {
      const reader = new NDEFReader();
      await reader.scan();
      alert("Approchez la carte NFC à enregistrer...");

      reader.onreading = (event) => {
        const tag = event.serialNumber || "inconnu";
        cards.push({ name, tag });
        saveCards();
        reader.onreading = null;
        reader.stop();
        alert(`Carte ${name} ajoutée avec succès !`);
      };

    } catch (error) {
      alert("Erreur lors de la lecture NFC : " + error);
    }
  }

  async function writeCard(index) {
    if (!("NDEFWriter" in window)) {
      alert("NFC non pris en charge pour l’écriture.");
      return;
    }

    const card = cards[index];
    try {
      const writer = new NDEFWriter();
      await writer.write(card.tag);
      alert(`Carte "${card.name}" écrite avec succès.`);
    } catch (error) {
      alert("Erreur d’écriture NFC : " + error);
    }
  }

  function deleteCard(index) {
    if (confirm("Supprimer cette carte ?")) {
      cards.splice(index, 1);
      saveCards();
    }
  }

  renderCards();
</script>

</body>
</html>
